<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetCode HW14</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>GitHub Users</h1>
    <div class="github-list">
      <table id="user-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Image</th>
          </tr>
        </thead>
        <tbody id="user-list"></tbody>
      </table>
      <div class="profile-card" id="profile"></div>
    </div>

    <h1>Color Components</h1>
    <div class="controls">
      <select id="component-select">
        <option value="0">first</option>
        <option value="1">second</option>
        <option value="2">third</option>
        <option value="3">fourth</option>
        <option value="4">fifth</option>
        <option value="5">sixth</option>
      </select>

      <select id="color-select">
        <option value="">Choose color</option>
        <option value="lightcoral">Red</option>
        <option value="lightskyblue">Blue</option>
        <option value="lightgreen">Green</option>
        <option value="burlywood">Brown</option>
      </select>
    </div>

    <div class="grid" id="color-grid"></div>
    <script src="script.js"></script>
  </body>
</html>

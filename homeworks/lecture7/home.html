<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cool Home Page</title>
</head>
<body>
  <h1>Welcome to Node.js Tutorial</h1>

  <form action="/create-post" method="post">
    <input type="text" name="title" placeholder="Title" required />
    <input type="text" name="content" placeholder="Content" required />
    <input type="submit" value="Submit" />
  </form>

  <div id="submitted-data" style="margin-top: 20px;"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");
    const content = params.get("content");

    if (title || content) {
      document.getElementById("submitted-data").innerHTML = `
        <h3>Submitted Data:</h3>
        <p><strong>Title:</strong> ${title || 'N/A'}</p>
        <p><strong>Content:</strong> ${content || 'N/A'}</p>
      `;
    }
  </script>
</body>
</html>
